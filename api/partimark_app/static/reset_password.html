<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activate Your Account — PartiMark</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
      padding: 2rem 1rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #818cf8;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4f46e5;
      margin: 1.25rem 0 0.75rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }

    .required::after {
      content: ' *';
      color: #f87171;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #818cf8; }

    .hint {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: -0.6rem;
      margin-bottom: 1rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) { background: #4338ca; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }

    .msg.success {
      background: #14532d22;
      border: 1px solid #16a34a44;
      color: #4ade80;
    }

    .msg.error {
      background: #7f1d1d22;
      border: 1px solid #dc262644;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PartiMark</div>

    <!-- Main form -->
    <div id="form-view">
      <h1>Activate your account</h1>
      <p class="subtitle">Complete your profile and choose a password to get started.</p>

      <form id="setup-form" novalidate>

        <div class="section-label">Your Profile</div>

        <div class="row">
          <div>
            <label for="first-name" class="required">First Name</label>
            <input type="text" id="first-name" placeholder="Jane" required />
          </div>
          <div>
            <label for="last-name" class="required">Last Name</label>
            <input type="text" id="last-name" placeholder="Smith" required />
          </div>
        </div>

        <label for="display-name" class="required">Display Name</label>
        <input type="text" id="display-name" placeholder="How your name appears in the app" required />

        <label for="preferred-name">Preferred Name <span style="color:#64748b;font-weight:400;">(optional)</span></label>
        <input type="text" id="preferred-name" placeholder="Nickname or preferred first name" />

        <div class="section-label">Set Password</div>

        <label for="new-password" class="required">New Password</label>
        <input type="password" id="new-password" placeholder="At least 8 characters" required />

        <label for="confirm-password" class="required">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Repeat your password" required />
        <p class="hint">Minimum 8 characters.</p>

        <button type="submit" id="submit-btn">Activate Account</button>
      </form>

      <div id="message" class="msg"></div>
    </div>

    <!-- No token in URL -->
    <div id="no-token-view" style="display:none; text-align:center; padding: 1rem 0;">
      <h1 style="margin-bottom:0.75rem;">Invalid Link</h1>
      <p style="color:#94a3b8; font-size:0.9rem;">
        This link is missing a token. Please use the link from your email,
        or contact your administrator for a new one.
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const API_BASE = window.location.origin;

    if (!token) {
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('no-token-view').style.display = 'block';
    }

    document.getElementById('setup-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName    = document.getElementById('first-name').value.trim();
      const lastName     = document.getElementById('last-name').value.trim();
      const displayName  = document.getElementById('display-name').value.trim();
      const preferredName = document.getElementById('preferred-name').value.trim() || null;
      const pwd          = document.getElementById('new-password').value;
      const confirm      = document.getElementById('confirm-password').value;
      const btn          = document.getElementById('submit-btn');

      // Client-side validation
      if (!firstName || !lastName || !displayName) {
        showMessage('First name, last name, and display name are required.', 'error');
        return;
      }
      if (pwd.length < 8) {
        showMessage('Password must be at least 8 characters.', 'error');
        return;
      }
      if (pwd !== confirm) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Activating…';

      try {
        const res = await fetch(`${API_BASE}/api/auth/set-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            new_password: pwd,
            first_name: firstName,
            last_name: lastName,
            display_name: displayName,
            preferred_name: preferredName,
          }),
        });

        const data = await res.json();

        if (res.ok) {
          showMessage('✓ ' + data.message, 'success');
          document.getElementById('setup-form').style.display = 'none';
        } else {
          showMessage(data.detail || 'Something went wrong. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Activate Account';
        }
      } catch (err) {
        showMessage('Network error. Please check your connection and try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Activate Account';
      }
    });

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = `msg ${type}`;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
